name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VILSEM_ENABLE_ONLINE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Verify release tag and main ancestry
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $env:GITHUB_REF_NAME -ne "v$releaseVersion") { throw 'Tag must match package version' }
          if ((Get-Content npm-shrinkwrap.json -Raw | ConvertFrom-Json).version -ne $releaseVersion) { throw 'Shrinkwrap version mismatch' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to main' }
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Pack and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm pack --pack-destination artifacts
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $releaseArchive = "vilsem-mcp-$env:RELEASE_VERSION.tgz"
          $releaseHash = (Get-FileHash "artifacts/$releaseArchive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$releaseHash  $releaseArchive" | Set-Content -Encoding utf8NoBOM "artifacts/SHA256SUMS-$env:RELEASE_VERSION.txt"
      - name: Attest archive and checksum file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Publish CI-built GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--title', "vilsem-mcp $env:RELEASE_VERSION", '--generate-notes')
          if ([int]($env:RELEASE_VERSION.Split('.')[0]) -lt 1 -or $env:RELEASE_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
          $releaseArgs += @("artifacts/vilsem-mcp-$env:RELEASE_VERSION.tgz", "artifacts/SHA256SUMS-$env:RELEASE_VERSION.txt")
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
