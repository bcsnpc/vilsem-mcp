name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VILSEM_ENABLE_ONLINE: '0'
      VILSEM_SCHEMA_SAMPLES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm run build
      - name: Test (browser checks skip only when Chrome/Edge or optional Playwright is absent)
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Report exact skipped tests
        if: always()
        run: node scripts/summarize-tests.mjs test-results.json
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-results
          path: test-results.json
  osv:
    name: OSV dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test -s npm-shrinkwrap.json
      # Google's scanner action is a Docker action, so this job needs Linux.
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            scan source
            --lockfile=npm-shrinkwrap.json
  semgrep:
    name: Semgrep ERROR findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/javascript --config p/typescript --config p/nodejs --config p/secrets --severity ERROR --error --metrics=off --disable-version-check --json --output semgrep.json --no-git-ignore --exclude node_modules --exclude .git --exclude dist/motion-runtime.js --exclude test-results.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-results
          path: semgrep.json
